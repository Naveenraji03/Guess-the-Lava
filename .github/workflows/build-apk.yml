name: Build APK
on:
  workflow_dispatch:
  push:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: guess_the_lava_python_complete/guess_the_lava_android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GuessTheLava-APK
          path: guess_the_lava_python_complete/guess_the_lava_android/app/build/outputs/apk/debug/*.apk
